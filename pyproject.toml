[project]
name = "forja3d"
version = "0.1.0"
description = "Agente de IA que projeta peças para a Creality Ender-3 V3 SE"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "cad: usa o kernel CAD real, em processo separado",
    "orca: usa o OrcaSlicer real",
    "ao_vivo: usa o endpoint de IA real; rode só sob comando",
]
addopts = "-m 'not ao_vivo'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["tests/dados", "scripts/fase0", "ferramentas", "projetos", "saida"]
