name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes no ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Bibliotecas do Qt e do VTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxrender1 libxi6 libxcursor1 libxcb-cursor0 xvfb

      - name: Dependências
        run: python -m pip install -r requirements.lock

      # O OrcaSlicer não vem no repositório: os testes que fatiam de verdade se pulam sozinhos.
      - name: Testes no Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -m "not ao_vivo and not orca" -q -rs

      - name: Testes no Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q -rs
