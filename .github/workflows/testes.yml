name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes no ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      # As vistas da peça usam OpenGL: no Linux, uma tela virtual; no Windows, o Mesa, porque o servidor não tem placa de vídeo.
      - uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true

      - name: Bibliotecas do Qt
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libegl1 libxcb-cursor0

      - name: Dependências
        run: python -m pip install -r requirements.lock

      # O OrcaSlicer não vem no repositório: os testes que fatiam de verdade se pulam sozinhos.
      - name: Testes no Linux
        if: runner.os == 'Linux'
        run: python -m pytest -m "not ao_vivo and not orca" -v --tb=short -rfEs

      - name: Testes no Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q --tb=short -rfEs
